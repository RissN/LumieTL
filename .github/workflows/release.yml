name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Monolith
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vue 3 Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Package Monolith Distribution
        run: |
          mkdir -p release/LumieTL_Web
          cp -r backend release/LumieTL_Web/
          cp -r core release/LumieTL_Web/
          cp -r security release/LumieTL_Web/
          cp -r utils release/LumieTL_Web/
          cp requirements.txt release/LumieTL_Web/
          echo "uvicorn backend.main:app --host 0.0.0.0 --port 18420" > release/LumieTL_Web/start.sh
          echo "uvicorn backend.main:app --host 127.0.0.1 --port 18420" > release/LumieTL_Web/start.bat
          chmod +x release/LumieTL_Web/start.sh
          PKG_VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          cd release && zip -r "LumieTL_Web_${PKG_VERSION}.zip" LumieTL_Web/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumieTL-Web
          path: release/LumieTL_Web_*.zip

  release:
    name: Publish Release
    needs: [build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            LumieTL-Web/*.zip
          generate_release_notes: true
